# BiomedIntel.ai — Render Blueprint for a PRIVATE STAGING environment.
#
# NOT DEPLOYED. Nothing in this repository deploys automatically. Follow
# docs/DEPLOYMENT.md step by step; it explains every value below.
#
# Creates (in your Render account, only when YOU apply the Blueprint):
#   • biomedintel-staging-db     Render Postgres 16 (private network only)
#   • biomedintel-staging        the web app (Node.js)
#   • biomedintel-staging-daily  the daily job: PM work orders, reminders,
#                                scheduled report snapshots
# These are paid resources. Check current prices on render.com/pricing before
# applying. Use FICTIONAL data only on staging.
#
# Secrets: no secret is written here. BETTER_AUTH_SECRET and APP_DB_PASSWORD
# are generated by Render. The app's database address is derived from the
# database's own address with the restricted user biomedintel_app and
# APP_DB_PASSWORD (server/db/app-url.ts), so nothing has to be typed in.

envVarGroups:
  - name: biomedintel-staging-shared
    envVars:
      - key: NODE_VERSION
        value: "22.22.0" # the version every check was run with
      - key: BETTER_AUTH_SECRET
        generateValue: true # random, generated once by Render
      - key: APP_DB_PASSWORD
        generateValue: true # password of the restricted app database user; the first deploy creates that user
      - key: BETTER_AUTH_URL
        value: https://biomedintel-staging.onrender.com # change if Render gives a different address
      - key: REQUIRE_MFA_FOR_PRIVILEGED_ROLES
        value: "true" # the app refuses to start in production with "false"
      - key: TRUSTED_IP_HEADER
        value: x-forwarded-for # see docs/DEPLOYMENT.md, "Visitor IP addresses"
      - key: PILOT_DATA_ALLOWED
        value: "true" # staging only: allows npm run pilot:data (fictional data). NEVER set for production.
      - key: AI_PROVIDER
        value: "" # AI off. Never "mock" on staging used for acceptance testing.

services:
  - type: web
    name: biomedintel-staging
    runtime: node
    region: singapore # nearest Render region to Australia and East Africa options; cannot be changed later
    # 1 CPU / 2 GB. The server used about 456 MB serving 20 pages at once in the
    # Stage 10 load test, too close to the 512 MB size. Pre-deploy needs a paid plan.
    plan: 1c-2g
    # Dev tools (Prisma CLI, tsx, TypeScript, Tailwind) are needed to build and migrate.
    buildCommand: npm ci --include=dev && npm run build
    # Checks the app database user, checks migrations, applies them, then
    # verifies every migration is recorded. If it fails, the old version keeps running.
    preDeployCommand: npm run db:predeploy
    startCommand: npm start
    healthCheckPath: /api/health/ready # 503 when the database is unreachable
    autoDeployTrigger: "off" # deploy only when you press "Manual Deploy"
    envVars:
      - fromGroup: biomedintel-staging-shared
      # The database's own address (owner). The pre-deploy step uses it to create
      # the app user and apply migrations; the running app uses it ONLY to build
      # its biomedintel_app address and refuses to start with a role that can
      # bypass row-level security.
      - key: DATABASE_URL_ADMIN
        fromDatabase:
          name: biomedintel-staging-db
          property: connectionString

  - type: cron
    name: biomedintel-staging-daily
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    schedule: "0 19 * * *" # once a day at 19:00 UTC (22:00 Nairobi, 06:00 Melbourne in summer)
    buildCommand: npm ci --include=dev
    startCommand: npm run jobs:daily
    envVars:
      - fromGroup: biomedintel-staging-shared
      - key: DATABASE_URL_ADMIN # used only to build the biomedintel_app address (see above)
        fromDatabase:
          name: biomedintel-staging-db
          property: connectionString

databases:
  - name: biomedintel-staging-db
    region: singapore
    postgresMajorVersion: "16" # the version every check was run with
    # 0.5 CPU / 1 GB. A PAID plan on purpose: Render's Free database plan has no
    # backups and no point-in-time recovery (render.com/docs/postgresql-backups,
    # checked 20 Oct 2026). 1 GB of storage is included; documents are stored in
    # the database, so watch disk use (docs/DEPLOYMENT.md).
    plan: 0.5c-1g
    databaseName: biomedintel_staging
    user: biomedintel_owner
    # Private network only: only the web service and the daily job can reach it.
    ipAllowList: []
